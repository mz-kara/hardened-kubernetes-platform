# --- Swap : Kubernetes refuse de démarrer s'il est actif ---
- name: Désactiver le swap immédiatement
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb > 0   # seulement s'il y en a

- name: Désactiver le swap au démarrage (commenter la ligne dans fstab)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

# --- Modules noyau nécessaires au réseau des conteneurs ---
- name: Charger les modules au démarrage
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Charger les modules maintenant
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

# --- Réglages réseau du noyau ---
- name: Autoriser le routage et le filtrage du trafic des ponts
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/k8s.conf
    reload: true
  loop:
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables
    - net.ipv4.ip_forward

- name: Installer les prérequis des dépôts APT
  ansible.builtin.apt:
    name:
      - python3-debian
      - ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ajouter le dépôt Docker (pour containerd)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    signed_by: https://download.docker.com/linux/ubuntu/gpg

- name: Installer containerd
  ansible.builtin.apt:
    name: containerd.io
    state: present
    update_cache: true

- name: Vérifier si la configuration de containerd est complète
  ansible.builtin.command: grep -q SystemdCgroup /etc/containerd/config.toml
  register: common_containerd_cfg
  changed_when: false
  failed_when: false

- name: Générer la configuration par défaut de containerd
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  when: common_containerd_cfg.rc != 0
  changed_when: true
  notify: Redémarrer containerd

- name: Utiliser le pilote cgroup systemd (comme le kubelet)
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Redémarrer containerd

- name: Démarrer containerd et l'activer au démarrage
  ansible.builtin.systemd_service:
    name: containerd
    state: started
    enabled: true

# --- kubeadm, kubelet depuis le dépôt officiel ---
- name: Ajouter le dépôt Kubernetes
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/"
    suites: /
    signed_by: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key"

- name: Installer kubeadm, kubelet et kubectl
  ansible.builtin.apt:
    name:
      - kubeadm
      - kubelet
    state: present
    update_cache: true

- name: Bloquer leur mise à jour automatique (les mises à jour se font avec kubeadm upgrade)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubeadm
    - kubelet

- name: Activer le kubelet au démarrage
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true