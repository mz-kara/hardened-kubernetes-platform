apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 9.2.2
    helm:
      valuesObject:
        driver:
          kind: modern_ebpf
        tty: true
        falco:
          json_output: true
        falcosidekick:
          enabled: true
          config:
            loki:
              hostport: http://loki.logging.svc.cluster.local:3100
              minimumpriority: notice
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true