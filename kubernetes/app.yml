# Application cible de la démo : Guestbook (exemple officiel Kubernetes)
# frontend PHP -> redis-leader (écriture) / redis-follower (lecture)
# Tout est dans le namespace "guestbook" ; la séparation des tiers se fait par labels.

apiVersion: v1
kind: Namespace
metadata:
  name: guestbook
  labels:
    # Applique Restricted en mode enforce
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest

---
# ---------- BACKEND : Redis ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: guestbook
  labels:
    app: redis
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      tier: backend
  template:
    metadata:
      labels:
        app: redis
        tier: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999      # utilisateur "redis"
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: docker.io/redis:7.4
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 200m
            memory: 200Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          #readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

---

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: guestbook
spec:
  type: ClusterIP
  selector:
    app: redis
    tier: backend
  ports:
  - port: 6379
    targetPort: 6379

---
# ---------- FRONTEND ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: guestbook
  labels:
    app: guestbook
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: guestbook
      tier: frontend
  template:
    metadata:
      labels:
        app: guestbook
        tier: frontend
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 10001      # utilisateur déclaré dans docker
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: guestbook-web:v1
        imagePullPolicy: Never
        env:
        - name: REDIS_HOST
          value: "redis"
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 200m
            memory: 200Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          #readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL


---
# Exposé en NodePort pour y accéder depuis le navigateur de l'hôte
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: guestbook
  labels:
    app: guestbook
    tier: frontend
spec:
  type: NodePort
  selector:
    app: guestbook
    tier: frontend
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080