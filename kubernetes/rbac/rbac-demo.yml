#Le RBAC ici ne sert qu'à faire la démo
#Avec automountServiceAccountToken: false, le pod ne reçoit aucun token pour parler au apiserver donc rbac reste inutile

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: rbac-demo
  name: pod-reader
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]

---

apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    kubernetes.io/enforce-mountable-secrets: "true"
  name: reader
  namespace: rbac-demo

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reads-pods
  namespace: default
subjects:
- kind: ServiceAccount
  name: reader
  namespace: rbac-demo
  apiGroup: ""
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: v1
kind: Pod
metadata:
  name: pod-demo
  namespace: rbac-demo
spec:
  serviceAccountName: reader
  automountServiceAccountToken: false
  containers:
  - name: nginx
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
    - containerPort: 80
